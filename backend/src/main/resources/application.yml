spring:
  application:
    name: todo-backend
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/todo_db?createDatabaseIfNotExist=true&serverTimezone=UTC}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:root}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  sql:
    init:
      mode: always
  jackson:
    deserialization:
      fail-on-unknown-properties: false

server:
  port: 8080

app:
  jwt:
    secret: ${JWT_SECRET:todo-app-dev-secret-change-me-0123456789abcdef}
    expiry-minutes: ${JWT_EXPIRY_MINUTES:60}
    issuer: todo-app
  admin:
    username: admin
    password: ${ADMIN_PASSWORD:admin}
  task:
    create-grace-minutes: 5
