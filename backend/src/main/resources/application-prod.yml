spring:
  application:
    name: todo-backend
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  sql:
    init:
      mode: always
      schema-locations: classpath:schema-postgresql.sql
  jackson:
    deserialization:
      fail-on-unknown-properties: false

server:
  port: 8080

app:
  jwt:
    secret: ${JWT_SECRET:todo-app-dev-secret-change-me-0123456789abcdef}
    expiry-minutes: ${JWT_EXPIRY_MINUTES:60}
    issuer: todo-app
  admin:
    username: admin
    password: ${ADMIN_PASSWORD:admin}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000}
  task:
    create-grace-minutes: 5
